<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Ashwake</title>
  <style>
    html, body { min-height: 100%; margin: 0; background: #050608; color: #f4efe4;
      font-family: Georgia, "Times New Roman", serif; }
    main { min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1.25rem; padding: 1.5rem; text-align: center; }
    h1 { font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase; font-size: 2rem; margin: 0; }
    a.play { display: inline-flex; min-height: 48px; min-width: 176px; align-items: center;
      justify-content: center; border-radius: 6px; border: 1px solid #c9a227; background: #c9a227;
      color: #1a1408; text-decoration: none; font-size: 15px; letter-spacing: 0.04em; }
    a.alt { color: #c9a227; }
    .muted { color: rgba(244,239,228,0.7); margin: 0; max-width: 28rem; }
    a.alt[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Ashwake</h1>
    <p class="muted">Tap Play. Keep this GitHub page — do not bookmark the next URL.</p>
    <a id="play" class="play" href="https://earlier-configurations-jewish-specify.trycloudflare.com" rel="noreferrer">Play</a>
    <a id="alt" class="alt" hidden rel="noreferrer">If Play fails, tap this</a>
  </main>
  <script>
    const fallback = "https://earlier-configurations-jewish-specify.trycloudflare.com";
    const ok = (s) => /^https:\/\/[a-z0-9.-]+/i.test(s);
    async function load(name) {
      const src = "https://raw.githubusercontent.com/alexsimeonoww/ashwake-play/main/" + name + "?t=" + Date.now();
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 2500);
      try {
        const res = await fetch(src, { cache: "no-store", signal: ctrl.signal });
        const text = (await res.text()).trim().split(/\s+/)[0];
        if (res.ok && ok(text)) return text;
      } catch {}
      finally { clearTimeout(timer); }
      return null;
    }
    Promise.all([load("url.txt"), load("backup.txt")]).then(([primary, backup]) => {
      const play = document.getElementById("play");
      const alt = document.getElementById("alt");
      const next = primary || fallback;
      play.href = next;
      if (backup && backup !== next) {
        alt.href = backup;
        alt.hidden = false;
      }
    });
  </script>
</body>
</html>
